# Packages the extension into a Web-Store-ready .zip and attaches it to a
# GitHub Release whenever a version tag (v*) is pushed. The extension itself
# stays build-free — these are exactly the files the browser loads, just zipped.
#
# To cut a release:
#   git tag v1.0.1 && git push origin v1.0.1
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Package extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Only the files the browser needs — no docs, CI, or repo metadata.
          zip -r "nox-${VERSION}.zip" \
            manifest.json \
            background.js \
            content.js \
            popup.html popup.css popup.js \
            icons \
            _locales

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "nox-${VERSION}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
